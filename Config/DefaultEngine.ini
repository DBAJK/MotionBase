; ── XR / OpenXR ───────────────────────────────────────────────
; HTC Vive Pro 연동은 OpenXR 플러그인 사용 (구형 SteamVR 플러그인은 UE 5.1에서 폐기).
; 비착용형(Non-HMD) 구동은 SteamVR null-driver 패치로 헤드셋 없이 base station 트래킹만 활용.

; ── VR 렌더링 설정 (셰이더 재컴파일 필요 — 첫 실행 시 한 번) ──
; VR은 눈이 2개라 드로우콜이 2배 → Instanced Stereo 로 한 번에 그려 CPU/GPU 비용 절감.
; Lumen(동적 GI)·Lumen 반사는 VR에서 지나치게 무거워 끈다 (Vive Pro 한 눈 3056² 해상도).
[/Script/Engine.RendererSettings]
vr.InstancedStereo=True
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=1
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
; ── Forward Shading 은 색/라이팅이 깨져 되돌림 (디퍼드 유지) ──
; 야구장 머티리얼이 디퍼드 기준이라 포워드로 전환 시 색이 사라졌음.
; r.ForwardShading=True   ← 사용 안 함

; ── 런타임 성능 CVar (셰이더 재컴파일 불필요, 시작 시 즉시 적용) ──
; Vive Pro 권장 해상도가 과도해서 PixelDensity 로 낮춘다. 필요하면 0.6까지 더 낮출 것.
